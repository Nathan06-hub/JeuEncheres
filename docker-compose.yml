services:
  # ------------------------------------------------------------------
  # PostgreSQL avec l'extension pgvector
  # ------------------------------------------------------------------
  encheres_postgres:
    image: pgvector/pgvector:pg16
    container_name: encheres_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-encheres_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Redis (cache & Pub/Sub)
  # ------------------------------------------------------------------
  encheres_redis:
    image: redis:7-alpine
    container_name: encheres_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD requis}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD requis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Backend FastAPI (Python 3.11, async)
  # ------------------------------------------------------------------
  encheres_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encheres_backend
    restart: unless-stopped
    depends_on:
      encheres_postgres:
        condition: service_healthy
      encheres_redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT requis}
      - DEBUG=${DEBUG:-False}
      - SQL_ECHO=${SQL_ECHO:-False}
      - POSTGRES_SERVER=encheres_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      - POSTGRES_DB=${POSTGRES_DB:-encheres_db}
      - REDIS_HOST=encheres_redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD requis}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY requis}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY requis}
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
