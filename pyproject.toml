[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "encheres-drafts-backend"
version = "0.1.0"
description = "FastAPI Backend with SQLAlchemy 2.0 Async, pgvector, Redis, and Gemini AI for Mobile Trivia Auction & Drafts Game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "redis>=5.0.4",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
