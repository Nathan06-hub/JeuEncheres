[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "encheres-drafts-backend"
version = "0.1.0"
description = "FastAPI Backend with SQLAlchemy 2.0 Async, pgvector, Redis, and Gemini AI for Mobile Trivia Auction & Drafts Game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "redis>=5.0.4,<9.0.0",
    "websockets>=12.0,<17.0",
    "pyjwt[crypto]>=2.8.0,<3.0.0",
    "bcrypt>=4.1.2,<6.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "google-genai>=2.24.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
